<!DOCTYPE html>
<html>
<head>
    <title>Images, Audio and Video</title>
</head>
<body>

    <h1>Images, Audio and Video in HTML</h1>

    <hr>

    <!-- Image Tag: Used to display an image on a webpage -->
    <h2>1. HTML Image</h2>

    <img src="images/nature.jpg"
         alt="Beautiful Nature"
         width="400"
         height="250">

    <hr>

    <!-- Audio Tag: Used to play audio files -->
    <h2>2. HTML Audio</h2>

    <audio controls>
        <source src="audio/music.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <hr>

    <!-- Video Tag: Used to play video files -->
    <h2>3. HTML Video</h2>

    <video width="400" height="250" controls>
        <source src="videos/sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <hr>

    <h2>4. Video with Poster</h2>

    <video width="400" height="250" controls poster="images/thumbnail.jpg">
        <source src="videos/sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>
</html>
